openapi: 3.1.0

info:
  title: SIGNOVA API
  version: 1.0.0
  description: >
    Contract API utama SIGNOVA Platform.
    Backend merupakan source of truth untuk tenant,
    capability, entitlement, state dan business rules.

servers:
  - url: /api/v1

tags:
  - name: Health
  - name: Auth
  - name: Customers
  - name: Catalog

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      responses:
        '200':
          description: Service health
        '500':
          $ref: '#/components/responses/InternalError'

  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 190
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CustomerStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Daftar pelanggan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'

    post:
      tags: [Customers]
      operationId: createCustomer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Pelanggan berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/TenantHeader'

    get:
      tags: [Customers]
      operationId: getCustomer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detail pelanggan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

    patch:
      tags: [Customers]
      operationId: updateCustomer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Pelanggan berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'


  /catalog/items:
    get:
      tags: [Catalog]
      operationId: listCatalogItems
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 190
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ActiveStatus'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CatalogItemType'
        - name: pricing_method
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PricingMethod'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Daftar barang dan jasa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemListResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

    post:
      tags: [Catalog]
      operationId: createCatalogItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogItemRequest'
      responses:
        '201':
          description: Barang atau jasa berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /catalog/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
      - $ref: '#/components/parameters/TenantHeader'

    get:
      tags: [Catalog]
      operationId: getCatalogItem
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detail barang atau jasa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'

    patch:
      tags: [Catalog]
      operationId: updateCatalogItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogItemRequest'
      responses:
        '200':
          description: Barang atau jasa berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /catalog/categories:
    get:
      tags: [Catalog]
      operationId: listCatalogCategories
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Daftar kategori
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCategoryListResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'

    post:
      tags: [Catalog]
      operationId: createCatalogCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogCategoryRequest'
      responses:
        '201':
          description: Kategori berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCategoryResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /catalog/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
      - $ref: '#/components/parameters/TenantHeader'

    patch:
      tags: [Catalog]
      operationId: updateCatalogCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogCategoryRequest'
      responses:
        '200':
          description: Kategori berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCategoryResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /units:
    get:
      tags: [Catalog]
      operationId: listUnits
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Daftar satuan tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitListResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    TenantHeader:
      name: X-Signova-Tenant
      in: header
      required: false
      description: >
        Tenant aktif. Wajib diberikan jika user memiliki
        lebih dari satu membership tenant aktif.
      schema:
        type: string
        minLength: 26
        maxLength: 26

    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        minLength: 26
        maxLength: 26

  schemas:
    CustomerStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE

    CustomerType:
      type: string
      enum:
        - COMPANY
        - INDIVIDUAL

    Customer:
      type: object
      required:
        - id
        - type
        - name
        - payment_terms_days
        - status
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        code:
          type:
            - string
            - 'null'
        type:
          $ref: '#/components/schemas/CustomerType'
        name:
          type: string
          maxLength: 190
        phone:
          type:
            - string
            - 'null'
        email:
          type:
            - string
            - 'null'
          format: email
        tax_id:
          type:
            - string
            - 'null'
        payment_terms_days:
          type: integer
          minimum: 0
        notes:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/CustomerStatus'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time

    CreateCustomerRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/CustomerType'
        code:
          type:
            - string
            - 'null'
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 190
        phone:
          type:
            - string
            - 'null'
          maxLength: 64
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 190
        tax_id:
          type:
            - string
            - 'null'
          maxLength: 100
        payment_terms_days:
          type: integer
          minimum: 0
          maximum: 3650
        notes:
          type:
            - string
            - 'null'

    UpdateCustomerRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/CustomerType'
        code:
          type:
            - string
            - 'null'
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 190
        phone:
          type:
            - string
            - 'null'
          maxLength: 64
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 190
        tax_id:
          type:
            - string
            - 'null'
          maxLength: 100
        payment_terms_days:
          type: integer
          minimum: 0
          maximum: 3650
        notes:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/CustomerStatus'


    ActiveStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE

    CatalogItemType:
      type: string
      enum:
        - PRODUCT
        - SERVICE

    PricingMethod:
      type: string
      enum:
        - STANDARD
        - AREA
        - LENGTH
        - VOLUME
        - TIME
        - PACKAGE
        - MANUAL

    CatalogItem:
      type: object
      required:
        - id
        - type
        - type_label
        - name
        - pricing_method
        - pricing_method_label
        - base_price
        - currency
        - status
        - status_label
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        category_id:
          type:
            - string
            - 'null'
        unit_id:
          type:
            - string
            - 'null'
        type:
          $ref: '#/components/schemas/CatalogItemType'
        type_label:
          type: string
          examples:
            - Barang
            - Jasa
        code:
          type:
            - string
            - 'null'
          maxLength: 100
        name:
          type: string
          maxLength: 190
        description:
          type:
            - string
            - 'null'
        pricing_method:
          $ref: '#/components/schemas/PricingMethod'
        pricing_method_label:
          type: string
          examples:
            - Harga Standar
            - Berdasarkan Luas
        base_price:
          type: string
          pattern: '^[0-9]+(\.[0-9]{2})$'
          example: '25000.00'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: IDR
        pricing_config:
          type:
            - object
            - 'null'
          additionalProperties: true
        status:
          $ref: '#/components/schemas/ActiveStatus'
        status_label:
          type: string
          examples:
            - Aktif
            - Nonaktif
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time

    CreateCatalogItemRequest:
      type: object
      required:
        - type
        - name
      additionalProperties: false
      properties:
        category_id:
          type:
            - string
            - 'null'
        unit_id:
          type:
            - string
            - 'null'
        type:
          $ref: '#/components/schemas/CatalogItemType'
        code:
          type:
            - string
            - 'null'
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 190
        description:
          type:
            - string
            - 'null'
        pricing_method:
          $ref: '#/components/schemas/PricingMethod'
        base_price:
          type: number
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: IDR
        pricing_config:
          type:
            - object
            - 'null'
          additionalProperties: true

    UpdateCatalogItemRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        category_id:
          type:
            - string
            - 'null'
        unit_id:
          type:
            - string
            - 'null'
        type:
          $ref: '#/components/schemas/CatalogItemType'
        code:
          type:
            - string
            - 'null'
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 190
        description:
          type:
            - string
            - 'null'
        pricing_method:
          $ref: '#/components/schemas/PricingMethod'
        base_price:
          type: number
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        pricing_config:
          type:
            - object
            - 'null'
          additionalProperties: true
        status:
          $ref: '#/components/schemas/ActiveStatus'

    CatalogCategory:
      type: object
      required:
        - id
        - name
        - status
        - status_label
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        code:
          type:
            - string
            - 'null'
          maxLength: 80
        name:
          type: string
          maxLength: 160
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        status:
          $ref: '#/components/schemas/ActiveStatus'
        status_label:
          type: string
          examples:
            - Aktif
            - Nonaktif

    CreateCatalogCategoryRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        code:
          type:
            - string
            - 'null'
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type:
            - string
            - 'null'
          maxLength: 500

    UpdateCatalogCategoryRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        code:
          type:
            - string
            - 'null'
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        status:
          $ref: '#/components/schemas/ActiveStatus'

    Unit:
      type: object
      required:
        - id
        - code
        - name
        - unit_type
        - unit_type_label
        - decimal_precision
        - status
        - status_label
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        code:
          type: string
          maxLength: 80
        name:
          type: string
          maxLength: 120
        symbol:
          type:
            - string
            - 'null'
          maxLength: 40
        unit_type:
          type: string
        unit_type_label:
          type: string
          examples:
            - Jumlah
            - Panjang
            - Luas
            - Waktu
            - Paket
        decimal_precision:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/ActiveStatus'
        status_label:
          type: string

    CatalogItemResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CatalogItem'
        message:
          type:
            - string
            - 'null'
        meta:
          $ref: '#/components/schemas/Meta'

    CatalogItemListResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CatalogCategoryResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CatalogCategory'
        message:
          type:
            - string
            - 'null'
        meta:
          $ref: '#/components/schemas/Meta'

    CatalogCategoryListResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCategory'
        meta:
          $ref: '#/components/schemas/Meta'

    UnitListResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Unit'
        meta:
          $ref: '#/components/schemas/Meta'

    Meta:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string

    PaginationMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          properties:
            current_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            last_page:
              type: integer

    ErrorObject:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required:
        - success
        - error
        - meta
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorObject'
        meta:
          $ref: '#/components/schemas/Meta'

    CustomerResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Customer'
        meta:
          $ref: '#/components/schemas/Meta'

    CustomerListResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

  responses:
    AuthRequired:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Capability or policy denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TenantSelectionRequired:
      description: Explicit tenant selection required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ResourceNotFound:
      description: Resource not found in accessible tenant context
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationFailed:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Sanitized internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
