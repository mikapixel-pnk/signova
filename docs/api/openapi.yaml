openapi: 3.1.0

info:
  title: SIGNOVA API
  version: 1.0.0
  description: >
    Contract API utama SIGNOVA Platform.
    Backend merupakan source of truth untuk tenant,
    capability, entitlement, state dan business rules.

servers:
  - url: /api/v1

tags:
  - name: Health
  - name: Auth
  - name: Customers
  - name: Quotations
  - name: Catalog

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      responses:
        '200':
          description: Service health
        '500':
          $ref: '#/components/responses/InternalError'

  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 190
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CustomerStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Daftar pelanggan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'

    post:
      tags: [Customers]
      operationId: createCustomer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Pelanggan berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/TenantHeader'

    get:
      tags: [Customers]
      operationId: getCustomer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detail pelanggan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

    patch:
      tags: [Customers]
      operationId: updateCustomer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Pelanggan berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'


  /quotations:
    get:
      tags: [Quotations]
      operationId: listQuotations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 190
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/QuotationStatus'
        - name: customer_id
          in: query
          required: false
          schema:
            type: string
            minLength: 26
            maxLength: 26
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Daftar penawaran
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationListResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

    post:
      tags: [Quotations]
      operationId: createQuotation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuotationRequest'
      responses:
        '201':
          description: Penawaran berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /quotations/{quotationId}:
    parameters:
      - name: quotationId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
      - $ref: '#/components/parameters/TenantHeader'

    get:
      tags: [Quotations]
      operationId: getQuotation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detail penawaran
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'


  /catalog/items:
    get:
      tags: [Catalog]
      operationId: listCatalogItems
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 190
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ActiveStatus'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CatalogItemType'
        - name: pricing_method
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PricingMethod'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Daftar barang dan jasa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemListResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

    post:
      tags: [Catalog]
      operationId: createCatalogItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogItemRequest'
      responses:
        '201':
          description: Barang atau jasa berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /catalog/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
      - $ref: '#/components/parameters/TenantHeader'

    get:
      tags: [Catalog]
      operationId: getCatalogItem
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detail barang atau jasa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'

    patch:
      tags: [Catalog]
      operationId: updateCatalogItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogItemRequest'
      responses:
        '200':
          description: Barang atau jasa berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /catalog/categories:
    get:
      tags: [Catalog]
      operationId: listCatalogCategories
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Daftar kategori
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCategoryListResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'

    post:
      tags: [Catalog]
      operationId: createCatalogCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogCategoryRequest'
      responses:
        '201':
          description: Kategori berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCategoryResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /catalog/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
      - $ref: '#/components/parameters/TenantHeader'

    patch:
      tags: [Catalog]
      operationId: updateCatalogCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogCategoryRequest'
      responses:
        '200':
          description: Kategori berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCategoryResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /units:
    get:
      tags: [Catalog]
      operationId: listUnits
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Daftar satuan tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitListResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TenantSelectionRequired'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    TenantHeader:
      name: X-Signova-Tenant
      in: header
      required: false
      description: >
        Tenant aktif. Wajib diberikan jika user memiliki
        lebih dari satu membership tenant aktif.
      schema:
        type: string
        minLength: 26
        maxLength: 26

    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        minLength: 26
        maxLength: 26

  schemas:
    CustomerStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE

    CustomerType:
      type: string
      enum:
        - COMPANY
        - INDIVIDUAL

    Customer:
      type: object
      required:
        - id
        - type
        - name
        - payment_terms_days
        - status
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        code:
          type:
            - string
            - 'null'
        type:
          $ref: '#/components/schemas/CustomerType'
        name:
          type: string
          maxLength: 190
        phone:
          type:
            - string
            - 'null'
        email:
          type:
            - string
            - 'null'
          format: email
        tax_id:
          type:
            - string
            - 'null'
        payment_terms_days:
          type: integer
          minimum: 0
        notes:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/CustomerStatus'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time

    CreateCustomerRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/CustomerType'
        code:
          type:
            - string
            - 'null'
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 190
        phone:
          type:
            - string
            - 'null'
          maxLength: 64
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 190
        tax_id:
          type:
            - string
            - 'null'
          maxLength: 100
        payment_terms_days:
          type: integer
          minimum: 0
          maximum: 3650
        notes:
          type:
            - string
            - 'null'

    UpdateCustomerRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/CustomerType'
        code:
          type:
            - string
            - 'null'
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 190
        phone:
          type:
            - string
            - 'null'
          maxLength: 64
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 190
        tax_id:
          type:
            - string
            - 'null'
          maxLength: 100
        payment_terms_days:
          type: integer
          minimum: 0
          maximum: 3650
        notes:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/CustomerStatus'


    ActiveStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE

    CatalogItemType:
      type: string
      enum:
        - PRODUCT
        - SERVICE

    PricingMethod:
      type: string
      enum:
        - STANDARD
        - AREA
        - LENGTH
        - VOLUME
        - TIME
        - PACKAGE
        - MANUAL

    CatalogItem:
      type: object
      required:
        - id
        - type
        - type_label
        - name
        - pricing_method
        - pricing_method_label
        - base_price
        - currency
        - status
        - status_label
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        category_id:
          type:
            - string
            - 'null'
        unit_id:
          type:
            - string
            - 'null'
        type:
          $ref: '#/components/schemas/CatalogItemType'
        type_label:
          type: string
          examples:
            - Barang
            - Jasa
        code:
          type:
            - string
            - 'null'
          maxLength: 100
        name:
          type: string
          maxLength: 190
        description:
          type:
            - string
            - 'null'
        pricing_method:
          $ref: '#/components/schemas/PricingMethod'
        pricing_method_label:
          type: string
          examples:
            - Harga Standar
            - Berdasarkan Luas
        base_price:
          type: string
          pattern: '^[0-9]+(\.[0-9]{2})$'
          example: '25000.00'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: IDR
        pricing_config:
          type:
            - object
            - 'null'
          additionalProperties: true
        status:
          $ref: '#/components/schemas/ActiveStatus'
        status_label:
          type: string
          examples:
            - Aktif
            - Nonaktif
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time

    CreateCatalogItemRequest:
      type: object
      required:
        - type
        - name
      additionalProperties: false
      properties:
        category_id:
          type:
            - string
            - 'null'
        unit_id:
          type:
            - string
            - 'null'
        type:
          $ref: '#/components/schemas/CatalogItemType'
        code:
          type:
            - string
            - 'null'
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 190
        description:
          type:
            - string
            - 'null'
        pricing_method:
          $ref: '#/components/schemas/PricingMethod'
        base_price:
          type: number
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: IDR
        pricing_config:
          type:
            - object
            - 'null'
          additionalProperties: true

    UpdateCatalogItemRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        category_id:
          type:
            - string
            - 'null'
        unit_id:
          type:
            - string
            - 'null'
        type:
          $ref: '#/components/schemas/CatalogItemType'
        code:
          type:
            - string
            - 'null'
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 190
        description:
          type:
            - string
            - 'null'
        pricing_method:
          $ref: '#/components/schemas/PricingMethod'
        base_price:
          type: number
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        pricing_config:
          type:
            - object
            - 'null'
          additionalProperties: true
        status:
          $ref: '#/components/schemas/ActiveStatus'

    CatalogCategory:
      type: object
      required:
        - id
        - name
        - status
        - status_label
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        code:
          type:
            - string
            - 'null'
          maxLength: 80
        name:
          type: string
          maxLength: 160
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        status:
          $ref: '#/components/schemas/ActiveStatus'
        status_label:
          type: string
          examples:
            - Aktif
            - Nonaktif

    CreateCatalogCategoryRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        code:
          type:
            - string
            - 'null'
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type:
            - string
            - 'null'
          maxLength: 500

    UpdateCatalogCategoryRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        code:
          type:
            - string
            - 'null'
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        status:
          $ref: '#/components/schemas/ActiveStatus'

    Unit:
      type: object
      required:
        - id
        - code
        - name
        - unit_type
        - unit_type_label
        - decimal_precision
        - status
        - status_label
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        code:
          type: string
          maxLength: 80
        name:
          type: string
          maxLength: 120
        symbol:
          type:
            - string
            - 'null'
          maxLength: 40
        unit_type:
          type: string
        unit_type_label:
          type: string
          examples:
            - Jumlah
            - Panjang
            - Luas
            - Waktu
            - Paket
        decimal_precision:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/ActiveStatus'
        status_label:
          type: string

    QuotationStatus:
      type: string
      enum:
        - DRAFT
        - SENT
        - VIEWED
        - APPROVED
        - REJECTED
        - EXPIRED
        - CANCELLED

    QuotationCustomerSummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        code:
          type:
            - string
            - 'null'
        name:
          type: string
          maxLength: 190

    QuotationItem:
      type: object
      required:
        - id
        - name
        - quantity
        - pricing_method
        - pricing_method_label
        - pricing_config
        - unit_price
        - discount_amount
        - tax_amount
        - amount
        - sort_order
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        catalog_item_id:
          type:
            - string
            - 'null'
        unit_id:
          type:
            - string
            - 'null'
        item_type:
          type:
            - string
            - 'null'
          enum:
            - PRODUCT
            - SERVICE
            - null
        item_type_label:
          type:
            - string
            - 'null'
        code:
          type:
            - string
            - 'null'
        name:
          type: string
          maxLength: 190
        description:
          type:
            - string
            - 'null'
        quantity:
          type: string
          example: '2.0000'
        unit_code:
          type:
            - string
            - 'null'
        unit_name:
          type:
            - string
            - 'null'
        unit_symbol:
          type:
            - string
            - 'null'
        pricing_method:
          $ref: '#/components/schemas/PricingMethod'
        pricing_method_label:
          type: string
        pricing_config:
          type: object
          additionalProperties: true
          description: >
            Snapshot input kalkulasi harga. Baseline mendukung
            width, height, depth, length, duration dan tax_rate.
        unit_price:
          $ref: '#/components/schemas/Money'
        discount_amount:
          $ref: '#/components/schemas/Money'
        tax_amount:
          $ref: '#/components/schemas/Money'
        amount:
          $ref: '#/components/schemas/Money'
        sort_order:
          type: integer
          minimum: 0

    QuotationVersion:
      type: object
      required:
        - id
        - revision_no
        - subtotal
        - discount_total
        - tax_total
        - total
        - currency
        - items
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        revision_no:
          type: integer
          minimum: 1
        subtotal:
          $ref: '#/components/schemas/Money'
        discount_total:
          $ref: '#/components/schemas/Money'
        tax_total:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: IDR
        terms:
          type:
            - string
            - 'null'
        notes:
          type:
            - string
            - 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuotationItem'
        created_at:
          type:
            - string
            - 'null'
          format: date-time

    Quotation:
      type: object
      required:
        - id
        - quotation_number
        - customer_id
        - status
        - status_label
        - source
        - current_version
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        quotation_number:
          type: string
          maxLength: 80
        customer_id:
          type: string
          minLength: 26
          maxLength: 26
        customer:
          $ref: '#/components/schemas/QuotationCustomerSummary'
        status:
          $ref: '#/components/schemas/QuotationStatus'
        status_label:
          type: string
          examples:
            - Draf
            - Terkirim
            - Sudah Dilihat
            - Disetujui
        valid_until:
          type:
            - string
            - 'null'
          format: date
        owner_user_id:
          type:
            - string
            - 'null'
        source:
          type: string
          example: MANUAL
        current_version:
          $ref: '#/components/schemas/QuotationVersion'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time

    CreateQuotationPricingConfig:
      type: object
      additionalProperties: true
      properties:
        width:
          type: number
          exclusiveMinimum: 0
        height:
          type: number
          exclusiveMinimum: 0
        depth:
          type: number
          exclusiveMinimum: 0
        length:
          type: number
          exclusiveMinimum: 0
        duration:
          type: number
          exclusiveMinimum: 0
      description: >
        Dimension field yang diwajibkan bergantung pada pricing_method.
        tax_rate dikirim sebagai field item terpisah pada request.

    CreateQuotationItem:
      type: object
      properties:
        catalog_item_id:
          type:
            - string
            - 'null'
          minLength: 26
          maxLength: 26
        unit_id:
          type:
            - string
            - 'null'
          minLength: 26
          maxLength: 26
        item_type:
          type:
            - string
            - 'null'
          enum:
            - PRODUCT
            - SERVICE
            - null
        code:
          type:
            - string
            - 'null'
          maxLength: 100
        name:
          type:
            - string
            - 'null'
          maxLength: 190
        description:
          type:
            - string
            - 'null'
        quantity:
          type: number
          exclusiveMinimum: 0
          default: 1
        pricing_method:
          oneOf:
            - $ref: '#/components/schemas/PricingMethod'
            - type: 'null'
          description: >
            Wajib untuk custom line. Jika catalog_item_id diberikan,
            metode harga dapat berasal dari snapshot catalog.
        pricing_config:
          oneOf:
            - $ref: '#/components/schemas/CreateQuotationPricingConfig'
            - type: 'null'
        unit_price:
          type:
            - number
            - 'null'
          minimum: 0
          description: >
            Wajib untuk custom line. Jika catalog_item_id diberikan,
            base_price catalog digunakan bila unit_price tidak dikirim.
        discount_amount:
          type: number
          minimum: 0
          default: 0
        tax_rate:
          type: number
          minimum: 0
          maximum: 100
          default: 0
        sort_order:
          type: integer
          minimum: 0
      description: >
        Item harus memiliki catalog_item_id atau data custom line
        yang memadai. amount dan tax_amount tidak diterima sebagai
        authoritative input; backend menghitung nilai final.

    CreateQuotationRequest:
      type: object
      required:
        - quotation_number
        - customer_id
        - items
      properties:
        quotation_number:
          type: string
          minLength: 1
          maxLength: 80
          description: >
            Nomor penawaran caller-supplied sementara sampai
            numbering policy SIGNOVA dikunci.
        customer_id:
          type: string
          minLength: 26
          maxLength: 26
        valid_until:
          type:
            - string
            - 'null'
          format: date
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: IDR
        terms:
          type:
            - string
            - 'null'
        notes:
          type:
            - string
            - 'null'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateQuotationItem'
      description: >
        subtotal, discount_total, tax_total, total, item tax_amount,
        item amount, tenant_id, status dan owner_user_id adalah
        backend-owned dan ditolak bila dikirim.

    Money:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]{2})$'
      example: '210000.00'

    QuotationResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Quotation'
        message:
          type:
            - string
            - 'null'
        meta:
          $ref: '#/components/schemas/Meta'

    QuotationListResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Quotation'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CatalogItemResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CatalogItem'
        message:
          type:
            - string
            - 'null'
        meta:
          $ref: '#/components/schemas/Meta'

    CatalogItemListResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CatalogCategoryResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CatalogCategory'
        message:
          type:
            - string
            - 'null'
        meta:
          $ref: '#/components/schemas/Meta'

    CatalogCategoryListResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCategory'
        meta:
          $ref: '#/components/schemas/Meta'

    UnitListResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Unit'
        meta:
          $ref: '#/components/schemas/Meta'

    Meta:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string

    PaginationMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          properties:
            current_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            last_page:
              type: integer

    ErrorObject:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required:
        - success
        - error
        - meta
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorObject'
        meta:
          $ref: '#/components/schemas/Meta'

    CustomerResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Customer'
        meta:
          $ref: '#/components/schemas/Meta'

    CustomerListResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

  responses:
    AuthRequired:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Capability or policy denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TenantSelectionRequired:
      description: Explicit tenant selection required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ResourceNotFound:
      description: Resource not found in accessible tenant context
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationFailed:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Sanitized internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
